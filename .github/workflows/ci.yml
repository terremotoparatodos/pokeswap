name: CI

on:
  push:
    branches: [main, migration]
  pull_request:
    branches: [main, migration, playtest/community-0.1]
  # Deploy workflows call this as their gate: no green CI, no deploy.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck / Lint / Test / Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch ecosystem compatibility baseline
        # Keep the real git-show comparison available with checkout's depth=1.
        # Failure to fetch is a gate failure, never a skip or a synthetic fixture.
        run: git fetch --no-tags --depth=1 origin 7739c4d4c1dba59b8dca3b66f379dea18082d108

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Ecosystem offline admission gate
        run: |
          node scripts/ecosystem/event-classification.mjs --check
          node scripts/integration/bundle-encounters.mjs --check
          node node_modules/vite-node/vite-node.mjs scripts/ecosystem/validate-inputs.ts

      - name: Production build
        run: npm run build
        env:
          # Anon key is safe to embed in public builds — it is publishable.
          # Add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY as repository
          # variables (Settings → Variables → Actions) so the build embeds
          # the real project URL for deploy previews.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_REALTIME_URL: ${{ vars.VITE_REALTIME_URL }}

  realtime:
    name: Realtime service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/realtime

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/realtime/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test
